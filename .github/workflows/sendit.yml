name: Proxy File Server

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime in minutes"
        required: true
        default: "330"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "240"
          - "330"

permissions:
  contents: write

concurrency:
  group: sendit
  cancel-in-progress: false

jobs:
  server:
    name: sendit
    runs-on: ubuntu-24.04
    timeout-minutes: 345

    env:
      # ==========================================
      # CONFIGURATION — EDIT THESE VALUES
      # ==========================================

      NGROK_AUTHTOKEN: "2sSOL9woYm3berKY1lMn8DyDdRa_5KY2F6cRxe2658WbBFDsh"

      PUBLIC_URL: "https://nondurable-tabetha-cellular.ngrok-free.dev"

      PORT: "8080"

      # File expires 20 minutes after upload
      EXPIRATION_SECONDS: "1200"

      # Maximum upload size: 25 MB
      MAX_FILE_MB: "25"

      # Synchronize every 30 seconds
      SYNC_SECONDS: "30"

      # ==========================================

      RUNTIME_MINUTES: ${{ inputs.runtime }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install ngrok
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc \
            >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok version

      - name: Prepare storage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/proxy-data"

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin transfer-storage; then

            git archive origin/transfer-storage data \
              | tar -xf - -C "$RUNNER_TEMP" || true

            if [[ -d "$RUNNER_TEMP/data" ]]; then
              cp -a "$RUNNER_TEMP/data/." \
                "$RUNNER_TEMP/proxy-data/"
            fi

          else
            echo "No previous storage found."
          fi

      - name: Create HTTP server
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/server.py" <<'PYTHON'
          import os
          import time
          import json
          import tempfile
          import threading

          from pathlib import Path
          from urllib.parse import urlsplit
          from http.server import (
              ThreadingHTTPServer,
              BaseHTTPRequestHandler
          )

          PORT = int(os.environ["PORT"])
          TTL = int(os.environ["EXPIRATION_SECONDS"])
          MAX_SIZE = int(os.environ["MAX_FILE_MB"]) * 1024 * 1024
          PUBLIC_URL = os.environ["PUBLIC_URL"]

          ROOT = Path(os.environ["RUNNER_TEMP"]) / "proxy-data"
          ROOT.mkdir(parents=True, exist_ok=True)

          DATA = ROOT / "proxies.txt"
          META = ROOT / "metadata.json"

          LOCK = threading.RLock()

          def get_metadata():
              with LOCK:

                  if not DATA.exists() or not META.exists():
                      return None

                  try:
                      metadata = json.loads(META.read_text())
                  except Exception:
                      return None

                  if time.time() >= metadata.get("expires", 0):
                      DATA.unlink(missing_ok=True)
                      META.unlink(missing_ok=True)
                      return None

                  return metadata

          class Handler(BaseHTTPRequestHandler):

              server_version = "ProxyServer/1.0"

              def respond(self, status, body=b"",
                          content_type="text/plain"):

                  self.send_response(status)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.end_headers()

                  if self.command != "HEAD":
                      self.wfile.write(body)

              def do_GET(self):

                  path = urlsplit(self.path).path

                  if path == "/health":
                      return self.respond(200, b"OK\n")

                  if path == "/status":

                      metadata = get_metadata()

                      response = {
                          "online": True,
                          "available": metadata is not None,
                          "metadata": metadata
                      }

                      return self.respond(
                          200,
                          json.dumps(response).encode(),
                          "application/json"
                      )

                  if path != "/latest/proxies.txt":
                      return self.respond(404, b"Not found\n")

                  with LOCK:

                      metadata = get_metadata()

                      if metadata is None:
                          return self.respond(
                              404,
                              b"File expired or unavailable\n"
                          )

                      content = DATA.read_bytes()

                  return self.respond(
                      200,
                      content,
                      "text/plain; charset=utf-8"
                  )

              def do_HEAD(self):
                  return self.do_GET()

              def do_PUT(self):

                  path = urlsplit(self.path).path

                  if path not in (
                      "/upload",
                      "/latest/proxies.txt"
                  ):
                      return self.respond(404, b"Not found\n")

                  try:
                      length = int(
                          self.headers.get("Content-Length", "-1")
                      )
                  except ValueError:
                      return self.respond(400, b"Invalid length\n")

                  if length < 0:
                      return self.respond(
                          411,
                          b"Content-Length required\n"
                      )

                  if length == 0:
                      return self.respond(400, b"Empty file\n")

                  if length > MAX_SIZE:
                      return self.respond(413, b"File too large\n")

                  content = self.rfile.read(length)

                  if len(content) != length:
                      return self.respond(400, b"Incomplete upload\n")

                  now = int(time.time())

                  metadata = {
                      "filename": "proxies.txt",
                      "uploaded": now,
                      "expires": now + TTL,
                      "size": length
                  }

                  with LOCK:

                      fd, temporary = tempfile.mkstemp(dir=ROOT)

                      try:

                          with os.fdopen(fd, "wb") as stream:
                              stream.write(content)
                              stream.flush()
                              os.fsync(stream.fileno())

                          os.replace(temporary, DATA)

                          temp_meta = ROOT / "metadata.tmp"
                          temp_meta.write_text(
                              json.dumps(metadata)
                          )

                          os.replace(temp_meta, META)

                      finally:
                          if os.path.exists(temporary):
                              os.unlink(temporary)

                  response = {
                      "success": True,
                      "download": (
                          PUBLIC_URL + "/latest/proxies.txt"
                      ),
                      "expires": metadata["expires"],
                      "size": length
                  }

                  return self.respond(
                      201,
                      json.dumps(response).encode(),
                      "application/json"
                  )

              def do_DELETE(self):

                  if urlsplit(self.path).path != "/latest/proxies.txt":
                      return self.respond(404, b"Not found\n")

                  with LOCK:
                      DATA.unlink(missing_ok=True)
                      META.unlink(missing_ok=True)

                  return self.respond(200, b"Deleted\n")

          def cleanup():
              while True:
                  get_metadata()
                  time.sleep(10)

          threading.Thread(
              target=cleanup,
              daemon=True
          ).start()

          server = ThreadingHTTPServer(
              ("127.0.0.1", PORT),
              Handler
          )

          print(
              f"Proxy server running on port {PORT}",
              flush=True
          )

          server.serve_forever()
          PYTHON

      - name: Start server
        shell: bash
        run: |
          set -euo pipefail

          python3 -u "$RUNNER_TEMP/server.py" \
            >"$RUNNER_TEMP/server.log" 2>&1 &

          echo "$!" >"$RUNNER_TEMP/server.pid"

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8080/health \
              >/dev/null; then

              echo "HTTP server ready."
              exit 0
            fi

            sleep 1
          done

          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Start ngrok tunnel
        shell: bash
        run: |
          set -euo pipefail

          ngrok http "$PORT" \
            --url "$PUBLIC_URL" \
            --pooling-enabled \
            --log stdout \
            >"$RUNNER_TEMP/ngrok.log" 2>&1 &

          echo "$!" >"$RUNNER_TEMP/ngrok.pid"

          for i in $(seq 1 30); do

            if ! kill -0 \
              "$(cat "$RUNNER_TEMP/ngrok.pid")" \
              2>/dev/null; then

              cat "$RUNNER_TEMP/ngrok.log"
              exit 1
            fi

            if curl -fsS \
              http://127.0.0.1:4040/api/tunnels \
              | jq -e \
                --arg url "$PUBLIC_URL" \
                '.tunnels[]? | select(.public_url == $url)' \
              >/dev/null; then

              echo "ngrok connected."
              exit 0
            fi

            sleep 2
          done

          cat "$RUNNER_TEMP/ngrok.log"
          exit 1

      - name: Run and synchronize
        shell: bash
        run: |
          set -euo pipefail

          STORAGE="$RUNNER_TEMP/proxy-data"

          sync_storage() {

            echo "Synchronizing storage..."

            mkdir -p "$RUNNER_TEMP/storage-work"

            cd "$RUNNER_TEMP/storage-work"

            if [[ ! -d .git ]]; then

              git init
              git checkout -b transfer-storage

              git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

              git config user.name "github-actions[bot]"
              git config user.email \
                "41898282+github-actions[bot]@users.noreply.github.com"

            fi

            mkdir -p data

            find data -mindepth 1 -maxdepth 1 \
              -type f -delete

            cp -a "$STORAGE/." data/

            touch data/.gitkeep

            git add -A

            if ! git diff --cached --quiet; then

              git commit -m \
                "Update proxy storage $(date -u +%FT%TZ)"

              git push origin HEAD:transfer-storage

            fi
          }

          trap 'sync_storage || true' EXIT

          END_TIME=$((
            $(date +%s) + RUNTIME_MINUTES * 60
          ))

          echo "======================================"
          echo "PROXY SERVER ONLINE"
          echo "======================================"
          echo "URL: $PUBLIC_URL"
          echo "Upload: $PUBLIC_URL/upload"
          echo "Download: $PUBLIC_URL/latest/proxies.txt"
          echo "Expiration: 20 minutes"
          echo

          while (( $(date +%s) < END_TIME )); do

            for service in server ngrok; do

              pid="$(cat "$RUNNER_TEMP/$service.pid")"

              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::$service stopped."
                exit 1
              fi

            done

            sync_storage

            sleep "$SYNC_SECONDS"
          done

          echo "Runtime completed."

      - name: Stop services
        if: always()
        shell: bash
        run: |
          for service in ngrok server; do

            pid_file="$RUNNER_TEMP/$service.pid"

            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi

          done

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          for service in server ngrok; do

            log="$RUNNER_TEMP/$service.log"

            if [[ -f "$log" ]]; then
              echo "===== $service ====="
              tail -100 "$log"
            fi

          done
