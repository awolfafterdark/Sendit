name: sendit

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */5 * * *"

  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime in minutes"
        required: true
        default: "330"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "240"
          - "330"

permissions:
  contents: read

concurrency:
  group: sendit
  cancel-in-progress: false

jobs:
  server:
    name: sendit
    runs-on: ubuntu-24.04
    timeout-minutes: 345

    env:
      # ==========================================
      # SENDIT CONFIGURATION
      # ==========================================

      NGROK_AUTHTOKEN: "2sSOL9woYm3berKY1lMn8DyDdRa_5KY2F6cRxe2658WbBFDsh"

      PUBLIC_URL: "https://nondurable-tabetha-cellular.ngrok-free.dev"

      PORT: "8080"

      # Files expire after 20 minutes
      EXPIRATION_SECONDS: "1200"

      # Maximum upload: 25 MB
      MAX_FILE_MB: "25"

      # Cleanup interval in seconds
      CLEANUP_SECONDS: "10"

      # ==========================================

      RUNTIME_MINUTES: ${{ inputs.runtime }}

    steps:
      - name: Install ngrok
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc \
            >/dev/null

          echo \
            "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok jq

          ngrok version

      - name: Prepare storage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sendit"

          echo "Storage initialized:"
          echo "$RUNNER_TEMP/sendit"

      - name: Create SendIt server
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sendit.py" <<'PYTHON'
          import os
          import time
          import json
          import tempfile
          import threading

          from pathlib import Path
          from urllib.parse import urlsplit
          from http.server import (
              ThreadingHTTPServer,
              BaseHTTPRequestHandler
          )

          PORT = int(os.environ["PORT"])
          TTL = int(os.environ["EXPIRATION_SECONDS"])
          MAX_SIZE = int(os.environ["MAX_FILE_MB"]) * 1024 * 1024
          CLEANUP_INTERVAL = int(os.environ["CLEANUP_SECONDS"])
          PUBLIC_URL = os.environ["PUBLIC_URL"].rstrip("/")

          ROOT = Path(os.environ["RUNNER_TEMP"]) / "sendit"
          ROOT.mkdir(parents=True, exist_ok=True)

          DATA = ROOT / "proxies.txt"
          META = ROOT / "metadata.json"

          LOCK = threading.RLock()

          START_TIME = int(time.time())

          def get_metadata():
              with LOCK:
                  if not DATA.exists() or not META.exists():
                      return None

                  try:
                      metadata = json.loads(META.read_text())
                  except (OSError, ValueError):
                      return None

                  if time.time() >= metadata.get("expires", 0):
                      DATA.unlink(missing_ok=True)
                      META.unlink(missing_ok=True)
                      return None

                  return metadata

          class Handler(BaseHTTPRequestHandler):

              server_version = "SendIt/1.0"

              def respond(
                  self,
                  status,
                  body=b"",
                  content_type="text/plain; charset=utf-8"
              ):
                  self.send_response(status)

                  self.send_header(
                      "Content-Type",
                      content_type
                  )

                  self.send_header(
                      "Content-Length",
                      str(len(body))
                  )

                  self.send_header(
                      "Cache-Control",
                      "no-store"
                  )

                  self.send_header(
                      "X-Content-Type-Options",
                      "nosniff"
                  )

                  self.send_header(
                      "Access-Control-Allow-Origin",
                      "*"
                  )

                  self.end_headers()

                  if self.command != "HEAD":
                      try:
                          self.wfile.write(body)
                      except (BrokenPipeError, ConnectionResetError):
                          pass

              def do_OPTIONS(self):
                  self.send_response(204)

                  self.send_header(
                      "Access-Control-Allow-Origin",
                      "*"
                  )

                  self.send_header(
                      "Access-Control-Allow-Methods",
                      "GET, HEAD, PUT, DELETE, OPTIONS"
                  )

                  self.send_header(
                      "Access-Control-Allow-Headers",
                      "Content-Type"
                  )

                  self.send_header(
                      "Content-Length",
                      "0"
                  )

                  self.end_headers()

              def do_GET(self):
                  path = urlsplit(self.path).path

                  if path in ("/", "/health"):
                      return self.respond(
                          200,
                          b"SendIt is online\n"
                      )

                  if path == "/status":
                      metadata = get_metadata()

                      response = {
                          "service": "sendit",
                          "online": True,
                          "uptime": int(time.time()) - START_TIME,
                          "available": metadata is not None,
                          "metadata": metadata,
                          "download": (
                              PUBLIC_URL + "/latest/proxies.txt"
                          ) if metadata else None
                      }

                      return self.respond(
                          200,
                          json.dumps(response).encode(),
                          "application/json"
                      )

                  if path != "/latest/proxies.txt":
                      return self.respond(
                          404,
                          b"Not found\n"
                      )

                  with LOCK:
                      metadata = get_metadata()

                      if metadata is None:
                          return self.respond(
                              404,
                              b"File expired or unavailable\n"
                          )

                      try:
                          content = DATA.read_bytes()
                      except OSError:
                          return self.respond(
                              404,
                              b"File unavailable\n"
                          )

                  return self.respond(
                      200,
                      content,
                      "text/plain; charset=utf-8"
                  )

              def do_HEAD(self):
                  return self.do_GET()

              def do_PUT(self):
                  path = urlsplit(self.path).path

                  if path not in (
                      "/upload",
                      "/latest/proxies.txt"
                  ):
                      return self.respond(
                          404,
                          b"Not found\n"
                      )

                  if self.headers.get("Transfer-Encoding"):
                      return self.respond(
                          400,
                          b"Transfer-Encoding not supported\n"
                      )

                  try:
                      length = int(
                          self.headers.get(
                              "Content-Length",
                              "-1"
                          )
                      )
                  except ValueError:
                      return self.respond(
                          400,
                          b"Invalid Content-Length\n"
                      )

                  if length < 0:
                      return self.respond(
                          411,
                          b"Content-Length required\n"
                      )

                  if length == 0:
                      return self.respond(
                          400,
                          b"Empty file\n"
                      )

                  if length > MAX_SIZE:
                      return self.respond(
                          413,
                          b"File exceeds maximum size\n"
                      )

                  self.connection.settimeout(60)

                  fd, temporary = tempfile.mkstemp(
                      prefix=".upload-",
                      dir=ROOT
                  )

                  try:
                      remaining = length

                      with os.fdopen(fd, "wb") as stream:
                          while remaining > 0:
                              chunk = self.rfile.read(
                                  min(1024 * 1024, remaining)
                              )

                              if not chunk:
                                  return self.respond(
                                      400,
                                      b"Incomplete upload\n"
                                  )

                              stream.write(chunk)
                              remaining -= len(chunk)

                          stream.flush()
                          os.fsync(stream.fileno())

                      now = int(time.time())

                      metadata = {
                          "filename": "proxies.txt",
                          "uploaded": now,
                          "expires": now + TTL,
                          "size": length
                      }

                      with LOCK:
                          os.replace(temporary, DATA)

                          meta_temp = ROOT / "metadata.tmp"

                          meta_temp.write_text(
                              json.dumps(metadata)
                          )

                          os.replace(meta_temp, META)

                      response = {
                          "success": True,
                          "filename": "proxies.txt",
                          "download": (
                              PUBLIC_URL + "/latest/proxies.txt"
                          ),
                          "uploaded": now,
                          "expires": now + TTL,
                          "expires_in": TTL,
                          "size": length
                      }

                      print(
                          f"[UPLOAD] {length} bytes "
                          f"expires in {TTL}s",
                          flush=True
                      )

                      return self.respond(
                          201,
                          json.dumps(response).encode(),
                          "application/json"
                      )

                  except (OSError, TimeoutError) as exc:
                      print(
                          f"[UPLOAD ERROR] {exc}",
                          flush=True
                      )

                      return self.respond(
                          500,
                          b"Upload failed\n"
                      )

                  finally:
                      if os.path.exists(temporary):
                          os.unlink(temporary)

              def do_DELETE(self):
                  path = urlsplit(self.path).path

                  if path != "/latest/proxies.txt":
                      return self.respond(
                          404,
                          b"Not found\n"
                      )

                  with LOCK:
                      DATA.unlink(missing_ok=True)
                      META.unlink(missing_ok=True)

                  print(
                      "[DELETE] proxies.txt removed",
                      flush=True
                  )

                  return self.respond(
                      200,
                      b"Deleted\n"
                  )

          def cleanup_worker():
              while True:
                  try:
                      get_metadata()
                  except Exception as exc:
                      print(
                          f"[CLEANUP ERROR] {exc}",
                          flush=True
                      )

                  time.sleep(CLEANUP_INTERVAL)

          threading.Thread(
              target=cleanup_worker,
              daemon=True
          ).start()

          server = ThreadingHTTPServer(
              ("127.0.0.1", PORT),
              Handler
          )

          server.daemon_threads = True

          print(
              f"[SENDIT] Listening on 127.0.0.1:{PORT}",
              flush=True
          )

          print(
              f"[SENDIT] Storage: {ROOT}",
              flush=True
          )

          print(
              f"[SENDIT] Expiration: {TTL}s",
              flush=True
          )

          server.serve_forever()
          PYTHON

      - name: Start SendIt server
        shell: bash
        run: |
          set -euo pipefail

          python3 -u "$RUNNER_TEMP/sendit.py" \
            >"$RUNNER_TEMP/sendit.log" 2>&1 &

          echo "$!" >"$RUNNER_TEMP/sendit.pid"

          for attempt in $(seq 1 30); do
            if curl -fsS \
              "http://127.0.0.1:${PORT}/health" \
              >/dev/null; then

              echo "SendIt HTTP server started."
              exit 0
            fi

            if ! kill -0 \
              "$(cat "$RUNNER_TEMP/sendit.pid")" \
              2>/dev/null; then

              cat "$RUNNER_TEMP/sendit.log"
              exit 1
            fi

            sleep 1
          done

          cat "$RUNNER_TEMP/sendit.log"
          exit 1

      - name: Start ngrok tunnel
        shell: bash
        run: |
          set -euo pipefail

          ngrok http "$PORT" \
            --url "$PUBLIC_URL" \
            --log stdout \
            >"$RUNNER_TEMP/ngrok.log" 2>&1 &

          echo "$!" >"$RUNNER_TEMP/ngrok.pid"

          for attempt in $(seq 1 30); do

            if ! kill -0 \
              "$(cat "$RUNNER_TEMP/ngrok.pid")" \
              2>/dev/null; then

              echo "ngrok stopped unexpectedly."
              cat "$RUNNER_TEMP/ngrok.log"
              exit 1
            fi

            if curl -fsS \
              http://127.0.0.1:4040/api/tunnels \
              2>/dev/null \
              | jq -e \
                --arg url "$PUBLIC_URL" \
                '.tunnels[]? | select(.public_url == $url)' \
              >/dev/null; then

              echo "ngrok tunnel established."
              echo "Public URL: $PUBLIC_URL"
              exit 0
            fi

            sleep 2
          done

          echo "ngrok tunnel failed to initialize."
          cat "$RUNNER_TEMP/ngrok.log"
          exit 1

      - name: Run SendIt
        shell: bash
        run: |
          set -euo pipefail

          END_TIME=$((
            $(date +%s) + RUNTIME_MINUTES * 60
          ))

          echo "======================================"
          echo "SENDIT SERVER ONLINE"
          echo "======================================"
          echo
          echo "URL: $PUBLIC_URL"
          echo
          echo "Upload:"
          echo "$PUBLIC_URL/upload"
          echo
          echo "Download:"
          echo "$PUBLIC_URL/latest/proxies.txt"
          echo
          echo "Status:"
          echo "$PUBLIC_URL/status"
          echo
          echo "Expiration: $EXPIRATION_SECONDS seconds"
          echo "Maximum upload: $MAX_FILE_MB MB"
          echo "Storage: Runner local filesystem"
          echo "Runtime: $RUNTIME_MINUTES minutes"
          echo

          {
            echo "## SendIt Server"
            echo
            echo "**Status:** Started"
            echo
            echo "**Public URL:** $PUBLIC_URL"
            echo
            echo "**Upload:** $PUBLIC_URL/upload"
            echo
            echo "**Download:** $PUBLIC_URL/latest/proxies.txt"
            echo
            echo "**Status:** $PUBLIC_URL/status"
            echo
            echo "**Expiration:** 20 minutes"
            echo
            echo "**Storage:** Runner local filesystem"
          } >> "$GITHUB_STEP_SUMMARY"

          while (( $(date +%s) < END_TIME )); do

            for service in sendit ngrok; do

              pid_file="$RUNNER_TEMP/$service.pid"

              if [[ ! -f "$pid_file" ]]; then
                echo "::error::$service PID missing."
                exit 1
              fi

              pid="$(cat "$pid_file")"

              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::$service stopped."
                exit 1
              fi

            done

            if ! curl -fsS \
              "http://127.0.0.1:${PORT}/health" \
              >/dev/null; then

              echo "::error::SendIt health check failed."
              exit 1
            fi

            sleep 10
          done

          echo "SendIt runtime completed."

      - name: Stop services
        if: always()
        shell: bash
        run: |
          for service in ngrok sendit; do

            pid_file="$RUNNER_TEMP/$service.pid"

            if [[ -f "$pid_file" ]]; then

              pid="$(cat "$pid_file")"

              kill "$pid" 2>/dev/null || true

            fi

          done

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          for service in sendit ngrok; do

            log="$RUNNER_TEMP/$service.log"

            if [[ -f "$log" ]]; then

              echo "===== $service ====="

              tail -100 "$log"

            fi

          done
