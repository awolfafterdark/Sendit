name: Inspect uploaded Archive 2
on:
  push:
    branches: ["codex/archive-2-inspection-20261020"]
    paths:
      - ".github/workflows/inspect-archive-2.yml"
      - "archive-inspection/**"
permissions:
  contents: read
concurrency:
  group: archive-2-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch inspection scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: archive-inspection
      - name: Validate inspector syntax
        run: python3 -m py_compile archive-inspection/inspect.py
      - name: Inspect archive without executing its contents
        run: python3 -u archive-inspection/inspect.py
