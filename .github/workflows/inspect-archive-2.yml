name: Check archived model compatibility
on:
  push:
    branches: ["codex/archive-2-inspection-20261020"]
    paths:
      - ".github/workflows/inspect-archive-2.yml"
      - "archive-inspection/**"
permissions:
  contents: read
concurrency:
  group: archive-2-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch inspection scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: archive-inspection
      - name: Install Core ML format parser
        run: |
          python3 -m venv "$RUNNER_TEMP/coreml-check"
          "$RUNNER_TEMP/coreml-check/bin/python" -m pip install --disable-pip-version-check coremltools==9.0
      - name: Check model serialization and interfaces
        run: '"$RUNNER_TEMP/coreml-check/bin/python" -u archive-inspection/check_models.py'
